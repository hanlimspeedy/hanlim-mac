AWSTemplateFormatVersion: '2010-09-09'
Description: >
  wrtp data migration - DMS replication instance, Oracle source + PostgreSQL target
  endpoints (Secrets Manager auth), and a full-load (optionally + CDC) replication task.

Parameters:
  Subnet1Id: { Type: AWS::EC2::Subnet::Id }
  Subnet2Id: { Type: AWS::EC2::Subnet::Id }
  DmsSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  ReplicationInstanceClass: { Type: String, Default: dms.t3.medium }
  OracleService: { Type: String, Default: ORCLPDB1 }
  OracleDmsSecretArn: { Type: String }
  PgDbName: { Type: String, Default: appdb }
  PgTargetSecretArn: { Type: String }
  SecretsAccessRoleArn:
    Type: String
    Description: Role DMS endpoints assume to read the secrets (reuse wrtp-sc-secrets-role).
  OracleSchema: { Type: String, Default: SAMPLE }
  MigrationType:
    Type: String
    Default: full-load
    AllowedValues: [full-load, full-load-and-cdc]
    Description: full-load (one-time) or full-load-and-cdc (bulk + ongoing replication).

Resources:
  DmsSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupIdentifier: wrtp-dms-subnet
      ReplicationSubnetGroupDescription: wrtp data migration subnet group
      SubnetIds: [!Ref Subnet1Id, !Ref Subnet2Id]
      Tags: [{ Key: Project, Value: wrtp }]

  ReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    Properties:
      ReplicationInstanceIdentifier: wrtp-dms-ri
      ReplicationInstanceClass: !Ref ReplicationInstanceClass
      AllocatedStorage: 50
      PubliclyAccessible: true
      MultiAZ: false
      ReplicationSubnetGroupIdentifier: !Ref DmsSubnetGroup
      VpcSecurityGroupIds: [!Ref DmsSecurityGroupId]
      Tags: [{ Key: Project, Value: wrtp }]

  SourceEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: wrtp-oracle-source
      EndpointType: source
      EngineName: oracle
      DatabaseName: !Ref OracleService
      OracleSettings:
        SecretsManagerSecretId: !Ref OracleDmsSecretArn
        SecretsManagerAccessRoleArn: !Ref SecretsAccessRoleArn
        # Oracle PDB can't use LogMiner -> Binary Reader (required for both full-load AND CDC).
        UseLogminerReader: false
        UseBFile: true
        # FRA-based archive dest (USE_DB_RECOVERY_FILE_DEST) reports type=PUBLIC, so DMS
        # auto-detection of a LOCAL dest finds none ("Cannot retrieve archived Redo log
        # destination ids" -> task FATAL). Pin to LOG_ARCHIVE_DEST_1 (dest_id 1) for CDC.
        ArchivedLogDestId: 1
      Tags: [{ Key: Project, Value: wrtp }]

  TargetEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: wrtp-pg-target
      EndpointType: target
      EngineName: postgres
      DatabaseName: !Ref PgDbName
      SslMode: require                  # RDS rejects non-SSL (pg_hba: no encryption)
      PostgreSqlSettings:
        SecretsManagerSecretId: !Ref PgTargetSecretArn
        SecretsManagerAccessRoleArn: !Ref SecretsAccessRoleArn
        AfterConnectScript: SET session_replication_role=replica   # bypass FK/triggers during load
      Tags: [{ Key: Project, Value: wrtp }]

  FullLoadTask:
    Type: AWS::DMS::ReplicationTask
    Properties:
      ReplicationTaskIdentifier: wrtp-fulltask
      MigrationType: !Ref MigrationType
      ReplicationInstanceArn: !Ref ReplicationInstance
      SourceEndpointArn: !Ref SourceEndpoint
      TargetEndpointArn: !Ref TargetEndpoint
      TableMappings: !Sub |
        {"rules":[
          {"rule-type":"selection","rule-id":"1","rule-name":"include-schema","object-locator":{"schema-name":"${OracleSchema}","table-name":"%"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"2","rule-name":"exclude-mlog","object-locator":{"schema-name":"${OracleSchema}","table-name":"MLOG$%"},"rule-action":"exclude"},
          {"rule-type":"transformation","rule-id":"3","rule-name":"drop-generated-line-total","rule-target":"column","object-locator":{"schema-name":"${OracleSchema}","table-name":"ORDER_ITEMS","column-name":"LINE_TOTAL"},"rule-action":"remove-column"},
          {"rule-type":"transformation","rule-id":"4","rule-name":"lc-schema","rule-target":"schema","object-locator":{"schema-name":"${OracleSchema}"},"rule-action":"convert-lowercase"},
          {"rule-type":"transformation","rule-id":"5","rule-name":"lc-table","rule-target":"table","object-locator":{"schema-name":"${OracleSchema}","table-name":"%"},"rule-action":"convert-lowercase"}
        ]}
      ReplicationTaskSettings: |
        {"FullLoadSettings":{"TargetTablePrepMode":"DO_NOTHING"},
         "ValidationSettings":{"EnableValidation":true},
         "Logging":{"EnableLogging":true}}
      Tags: [{ Key: Project, Value: wrtp }]

Outputs:
  ReplicationInstanceArn: { Value: !Ref ReplicationInstance }
  SourceEndpointArn: { Value: !Ref SourceEndpoint }
  TargetEndpointArn: { Value: !Ref TargetEndpoint }
  ReplicationTaskArn: { Value: !Ref FullLoadTask }
