AWSTemplateFormatVersion: '2010-09-09'
Description: wrtp network - dedicated VPC, 2 public subnets, IGW, security groups.

Parameters:
  OnPremCidr:
    Type: String
    Description: On-prem work server public IP in CIDR form (e.g. 203.0.113.10/32) allowed to reach RDS.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: wrtp-vpc }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: wrtp-igw }]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: wrtp-public-1 }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: wrtp-public-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: wrtp-public-rt }] }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  Assoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  Assoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  # DMS/SC compute: outbound only (reach Oracle public IP + RDS + AWS APIs). Default egress allow-all.
  DmsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: wrtp DMS / Schema Conversion egress
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: wrtp-dms-sg }]

  # RDS target: inbound 5432 from on-prem (for pg_dump) and from DMS SG (for load).
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: wrtp RDS PostgreSQL ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: !Ref OnPremCidr }
      Tags: [{ Key: Name, Value: wrtp-rds-sg }]
  RdsIngressFromDms:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DmsSecurityGroup

Outputs:
  VpcId: { Value: !Ref Vpc }
  PublicSubnet1Id: { Value: !Ref PublicSubnet1 }
  PublicSubnet2Id: { Value: !Ref PublicSubnet2 }
  DmsSecurityGroupId: { Value: !Ref DmsSecurityGroup }
  RdsSecurityGroupId: { Value: !Ref RdsSecurityGroup }
