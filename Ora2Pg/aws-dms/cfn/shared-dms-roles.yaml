AWSTemplateFormatVersion: '2010-09-09'
Description: >
  wrtp shared DMS service roles (dms-vpc-role, dms-cloudwatch-logs-role).
  ACCOUNT-SHARED with fixed names required by AWS DMS. Teardown EXCLUDES these by
  default (other DMS usage may depend on them). Only deployed if they are absent.

Resources:
  DmsVpcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dms-vpc-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: dms.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      Tags: [{ Key: Project, Value: wrtp }]

  DmsCloudWatchLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dms-cloudwatch-logs-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: dms.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSCloudWatchLogsRole
      Tags: [{ Key: Project, Value: wrtp }]
