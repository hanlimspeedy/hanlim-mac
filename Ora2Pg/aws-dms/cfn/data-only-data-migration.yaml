AWSTemplateFormatVersion: '2010-09-09'
Description: >
  wrtp data-only migration - DMS replication instance, Oracle source + PostgreSQL
  target endpoints, and a full-load-and-cdc task that loads base table data only.

Parameters:
  Subnet1Id: { Type: AWS::EC2::Subnet::Id }
  Subnet2Id: { Type: AWS::EC2::Subnet::Id }
  DmsSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  ReplicationInstanceClass: { Type: String, Default: dms.t3.medium }
  OracleService: { Type: String, Default: ORCLPDB1 }
  OracleDmsSecretArn: { Type: String }
  PgDbName: { Type: String, Default: appdb }
  PgTargetSecretArn: { Type: String }
  SecretsAccessRoleArn:
    Type: String
    Description: Role DMS endpoints assume to read the secrets.
  OracleSchema: { Type: String, Default: SAMPLE }

Resources:
  DmsSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupIdentifier: wrtp-data-only-dms-subnet
      ReplicationSubnetGroupDescription: wrtp data-only migration subnet group
      SubnetIds: [!Ref Subnet1Id, !Ref Subnet2Id]
      Tags: [{ Key: Project, Value: wrtp }]

  ReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    Properties:
      ReplicationInstanceIdentifier: wrtp-data-only-dms-ri
      ReplicationInstanceClass: !Ref ReplicationInstanceClass
      AllocatedStorage: 50
      PubliclyAccessible: true
      MultiAZ: false
      ReplicationSubnetGroupIdentifier: !Ref DmsSubnetGroup
      VpcSecurityGroupIds: [!Ref DmsSecurityGroupId]
      Tags: [{ Key: Project, Value: wrtp }]

  SourceEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: wrtp-data-only-oracle-source
      EndpointType: source
      EngineName: oracle
      DatabaseName: !Ref OracleService
      OracleSettings:
        SecretsManagerSecretId: !Ref OracleDmsSecretArn
        SecretsManagerAccessRoleArn: !Ref SecretsAccessRoleArn
        UseLogminerReader: false
        UseBFile: true
        ArchivedLogDestId: 1
      Tags: [{ Key: Project, Value: wrtp }]

  TargetEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: wrtp-data-only-pg-target
      EndpointType: target
      EngineName: postgres
      DatabaseName: !Ref PgDbName
      SslMode: require
      PostgreSqlSettings:
        SecretsManagerSecretId: !Ref PgTargetSecretArn
        SecretsManagerAccessRoleArn: !Ref SecretsAccessRoleArn
        AfterConnectScript: SET session_replication_role=replica
      Tags: [{ Key: Project, Value: wrtp }]

  DataOnlyFullLoadAndCdcTask:
    Type: AWS::DMS::ReplicationTask
    Properties:
      ReplicationTaskIdentifier: wrtp-data-only-task
      MigrationType: full-load-and-cdc
      ReplicationInstanceArn: !Ref ReplicationInstance
      SourceEndpointArn: !Ref SourceEndpoint
      TargetEndpointArn: !Ref TargetEndpoint
      TableMappings: !Sub |
        {"rules":[
          {"rule-type":"selection","rule-id":"1","rule-name":"include-audit-log","object-locator":{"schema-name":"${OracleSchema}","table-name":"AUDIT_LOG"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"2","rule-name":"include-customers","object-locator":{"schema-name":"${OracleSchema}","table-name":"CUSTOMERS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"3","rule-name":"include-departments","object-locator":{"schema-name":"${OracleSchema}","table-name":"DEPARTMENTS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"4","rule-name":"include-employees","object-locator":{"schema-name":"${OracleSchema}","table-name":"EMPLOYEES"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"5","rule-name":"include-employee-targets","object-locator":{"schema-name":"${OracleSchema}","table-name":"EMPLOYEE_TARGETS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"6","rule-name":"include-order-items","object-locator":{"schema-name":"${OracleSchema}","table-name":"ORDER_ITEMS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"7","rule-name":"include-order-status-dim","object-locator":{"schema-name":"${OracleSchema}","table-name":"ORDER_STATUS_DIM"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"8","rule-name":"include-orders","object-locator":{"schema-name":"${OracleSchema}","table-name":"ORDERS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"9","rule-name":"include-products","object-locator":{"schema-name":"${OracleSchema}","table-name":"PRODUCTS"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"10","rule-name":"include-region-dim","object-locator":{"schema-name":"${OracleSchema}","table-name":"REGION_DIM"},"rule-action":"include"},
          {"rule-type":"selection","rule-id":"11","rule-name":"include-tax-rates","object-locator":{"schema-name":"${OracleSchema}","table-name":"TAX_RATES"},"rule-action":"include"},
          {"rule-type":"transformation","rule-id":"12","rule-name":"drop-generated-line-total","rule-target":"column","object-locator":{"schema-name":"${OracleSchema}","table-name":"ORDER_ITEMS","column-name":"LINE_TOTAL"},"rule-action":"remove-column"},
          {"rule-type":"transformation","rule-id":"13","rule-name":"lc-schema","rule-target":"schema","object-locator":{"schema-name":"${OracleSchema}"},"rule-action":"convert-lowercase"},
          {"rule-type":"transformation","rule-id":"14","rule-name":"lc-table","rule-target":"table","object-locator":{"schema-name":"${OracleSchema}","table-name":"%"},"rule-action":"convert-lowercase"}
        ]}
      ReplicationTaskSettings: |
        {"FullLoadSettings":{"TargetTablePrepMode":"DO_NOTHING"},
         "ValidationSettings":{"EnableValidation":true},
         "Logging":{"EnableLogging":true}}
      Tags: [{ Key: Project, Value: wrtp }]

Outputs:
  ReplicationInstanceArn: { Value: !Ref ReplicationInstance }
  SourceEndpointArn: { Value: !Ref SourceEndpoint }
  TargetEndpointArn: { Value: !Ref TargetEndpoint }
  ReplicationTaskArn: { Value: !Ref DataOnlyFullLoadAndCdcTask }
